settings:
  modal:
    title: Cài đặt
  app:
    title: Ứng dụng
    basic:
      title: Cơ bản
      mainWindowCloseAction:
        label: Hành động Đóng Cửa sổ Chính
        description: Hành động sẽ được thực hiện khi cửa sổ chính bị đóng
        options:
          minimize-to-tray: Thu nhỏ vào khay
          quit: Thoát
          ask: Hỏi mỗi lần
      preferredLolSource:
        label: Nguồn Dữ liệu Ưu tiên
        description: Chọn nguồn dữ liệu API Liên Minh Huyền Thoại ưu tiên
        howToChoose: Làm thế nào để chọn?
        unsupported: 'SGP API không được hỗ trợ: {{server}}'
        options:
          sgp: SGP API
          lcu: LCU API
        tip:
          sgp:
            title: SGP API
            feature1: Hiệu suất truy vấn nhanh với phản hồi nhanh chóng
            feature2: Cung cấp dữ liệu trận đấu chi tiết hơn
            feature3: Hỗ trợ tra cứu lịch sử trận đấu liên vùng trên máy chủ nội địa
            warning: Khi sử dụng VPN/accelerator để chơi ở máy chủ nước ngoài, kết nối có thể thất bại hoặc rất chậm
          lcu:
            title: LCU API (Máy khách Cục bộ)
            feature1: Độ ổn định cao, không bị ảnh hưởng bởi điều kiện mạng
            feature2: Đáng tin cậy ngay cả khi sử dụng VPN/accelerator
            warning: 'Vấn đề đã biết: Truy vấn lịch sử trận đấu trong lúc chọn tướng có thể gây sập máy khách game'
      theme:
        label: Màu Chủ đề
        description: Màu chủ đề cho $t(common:appName)
        groups:
          system: Hệ thống
          brightBuiltin: Sáng
          darkBuiltin: Tối
        tone:
          light: Sáng
          dark: Tối
        options:
          default: Theo Hệ thống
          light: Sáng
          dark: Tối
          graphite: Xanh Than Chì
          cyber: Cyber Neon
          sakura: Hồng Sakura
          mint: Xanh Bạc Hà
          aurora: Tím Aurora
          neon: Tím Neon
          butter: Vàng Bơ
      locale:
        label: Ngôn ngữ
        description: Chọn ngôn ngữ giao diện của ứng dụng
      enableAnimations:
        label: Hiệu ứng Hoạt họa (Animations)
        description: Bật hiệu ứng chuyển động sống động, hào quang Game HUD và nhịp xung radar
    selfUpdate:
      title: Cập nhật Ứng dụng
      temporarilyUnsupported: Cập nhật trong ứng dụng hiện không được hỗ trợ trên nền tảng này. Kiểm tra cập nhật và tự động cập nhật đã bị tắt.
      autoCheckUpdates:
        label: Tự động Kiểm tra Cập nhật
        description: Định kỳ kiểm tra phiên bản mới
      autoDownloadUpdates:
        label: Tự động Tải Cập nhật
        description: Tự động bắt đầu quá trình cập nhật khi phát hiện phiên bản mới
      checkUpdates: Kiểm tra Cập nhật
      currentRelease: Bản phát hành Hiện tại
      downloadRelease: Tải Bản phát hành
      newRelease: Bản phát hành Mới
      cancelUpdate: Hủy Cập nhật
      restartNow: Khởi động lại Ngay
      updateProgress:
        label: Tiến trình Cập nhật
        description: Tiến trình cập nhật đang diễn ra
        downloading: Đang tải gói cập nhật
        finished: Đã hoàn thành {{progress}}%
        remain: Còn lại {{time}}
        downloadFailed: Tải thất bại
        waitingForRestart: Đang chờ khởi động lại
        waitingForRestartDescription: Quá trình tự động cập nhật sẽ được thực hiện sau khi đóng ứng dụng
      checkUpdatesResult:
        no-updates: Không có phiên bản mới
        new-updates: Có phiên bản mới
        failed: Không thể kiểm tra cập nhật {{reason}}
      updateDir:
        label: Thư mục Cập nhật
        description: Vị trí hiện tại của bản cập nhật đã tải. Nếu không thể thực hiện quá trình tự động cập nhật hoàn chỉnh, cần cập nhật thủ công
        open: Mở
    mainWindowUi:
      title: Giao diện Cửa sổ Chính
      background:
        label: Nền
        description: Đặt chế độ nền cho cửa sổ chính
        options:
          profileSkin: Nền Tướng
          none: Không
          mica: Mica
          customImage: Hình ảnh tùy chỉnh
          system: Mặc định hệ thống
        tooltips:
          profileSkin: Sử dụng nền trang phục hồ sơ của người chơi hiện tại làm nền cửa sổ chính
          mica: Chỉ khả dụng trên các phiên bản Windows mới hơn. Nếu không được hỗ trợ trên nền tảng hiện tại, sẽ tự động chuyển về Không
          micaUnsupported: Mica không được hỗ trợ trên nền tảng hiện tại và sẽ chuyển về Không
          system: Sử dụng hình nền mặc định của hệ thống
      useProfileSkinAsBackground:
        label: Sử dụng Nền Trang phục Hồ sơ
        description: $t(common:appName) sẽ sử dụng nền trang phục hồ sơ của người chơi hiện tại làm nền. Nếu nền đã được đặt, tùy chọn này sẽ không có hiệu lực
      backgroundMaterial:
        label: Chất liệu Nền
        description: Đặt chất liệu nền của giao diện ứng dụng, yêu cầu phiên bản hệ thống hỗ trợ cụ thể
        options:
          none: Không
          mica: Mica
          micaUnsupported: Mica (Không được hỗ trợ)
    lcConnection:
      title: Kết nối LCU
      autoConnect:
        label: Tự động Kết nối
        description: Tự động kết nối với máy khách khi có một máy khách duy nhất
      useWmi:
        label: Sử dụng WMIC
        description: Sử dụng WMIC để lấy thông tin dòng lệnh của máy khách thay vì phương thức Win32 API mặc định. Yêu cầu quyền quản trị viên
      rebuildWmi:
        label: Xây dựng lại WMI
        description: Nếu WMIC không hoạt động đúng, hãy thử cách này
        rebuildButton: Xây dựng lại WMI
    misc:
      title: Linh tinh
      logLevel:
        label: Cấp độ Ghi log
        description: Đặt cấp độ ghi log của ứng dụng
      disableHardwareAcceleration:
        label: Tắt Tăng tốc Phần cứng
        description: Tắt tăng tốc phần cứng, có thể giải quyết một số vấn đề hiển thị, như font chữ bị mờ
      disableHardwareAccelerationDialog:
        enableText: Bật Tăng tốc Phần cứng
        disableText: Tắt Tăng tốc Phần cứng
        disableConfirmation: Sẽ tắt tăng tốc phần cứng, khởi động lại ứng dụng để áp dụng thay đổi
        enableConfirmation: Sẽ bật tăng tốc phần cứng, khởi động lại ứng dụng để áp dụng thay đổi
        positiveText: Khởi động lại & Thoát
        negativeText: Hủy
      fullGpuAcceleration:
        label: Sử dụng Tối đa GPU
        description: Ép bật GPU Rasterization và bỏ qua danh sách chặn để tận dụng tối đa GPU. Có thể gây xung đột nhẹ nếu máy có GPU yếu khi chơi game
      fullGpuAccelerationDialog:
        enableText: Bật Sử dụng Tối đa GPU
        disableText: Tắt Sử dụng Tối đa GPU
        disableConfirmation: Sẽ tắt chế độ sử dụng tối đa GPU, khởi động lại ứng dụng để áp dụng thay đổi
        enableConfirmation: Sẽ bật chế độ sử dụng tối đa GPU, khởi động lại ứng dụng để áp dụng thay đổi
        positiveText: Khởi động lại & Thoát
        negativeText: Hủy
      httpProxy:
        strategy:
          label: HTTP Proxy
          description: Đặt HTTP proxy. Tất cả yêu cầu mạng ngoại trừ LCU HTTP sẽ được định tuyến qua proxy này
          options:
            force: Sử dụng Proxy
            auto: Tự động
            disable: Tắt
        host:
          label: Máy chủ Proxy
          description: Máy chủ của proxy server
        port:
          label: Cổng Proxy
          description: Cổng của proxy server
      uninstallApp:
        label: Gỡ cài đặt Ứng dụng
        description: Gỡ cài đặt ứng dụng, sẽ xóa tất cả dữ liệu và cấu hình
        button: Gỡ cài đặt Ứng dụng
        title: Gỡ cài đặt Ứng dụng
        content: Bạn có chắc chắn muốn gỡ cài đặt $t(common:appName)? Thao tác này cũng sẽ xóa tất cả dữ liệu ứng dụng.
        positiveText: Gỡ cài đặt
        negativeText: Hủy
  matchHistory:
    title: Tab Lịch sử Trận đấu
    refreshTabsAfterGameEnds:
      label: Làm mới Tab Sau Khi Trận Kết thúc
      description: Tự động làm mới các tab lịch sử trận đấu sau khi trận kết thúc. Do độ trễ của máy chủ từ xa, việc làm mới có thể không kịp thời
    loadCount:
      label: Số Lượng Tải
      description: Số trận đấu sẽ tải cho mỗi tab lịch sử trận đấu.
    showJunglePathing:
      label: Bật Đường đi Rừng
      description: Hiển thị mục đường đi rừng và thẻ phân tích trên trang lịch sử trận đấu.
    matchCardOpacity:
      label: Độ Trong Suốt
      description: Điều chỉnh độ trong suốt của thẻ lịch sử trận đấu.
  ongoingGame:
    title: Trận Đang Diễn Ra
    titleCommon: Trận Đang Diễn Ra
    titlePlayerCard: Thẻ Người chơi
    enabled:
      label: Bật
      description: Thực hiện phân tích trận đấu khi vào giai đoạn chọn tướng hoặc trong trận.
    autoRouteWhenGameStarts:
      label: Tự động Chuyển đến Trận Đang Diễn Ra
      description: Tự động chuyển đến trang trận đang diễn ra khi vào giai đoạn chọn tướng hoặc khi trận bắt đầu. Được loại trừ trong giai đoạn phòng chờ.
    matchHistoryLoadCount:
      label: Số Lượng Lịch sử Trận đấu Tải
      description: Số trận đấu để tải nhằm phân tích hiệu suất của mỗi người chơi trên trang trận đấu.
    concurrency:
      label: Giới hạn Yêu cầu Đồng thời
      description: Giới hạn tổng số yêu cầu mạng đồng thời trong quá trình phân tích trận đấu. Điều này không ảnh hưởng đến giới hạn đồng thời của các mô-đun khác.
    matchHistoryTagPreference:
      label: Ưu tiên Bộ lọc Chế độ
      description: Ưu tiên bộ lọc chế độ khi tải lịch sử trận đấu bằng API SGP.
      options:
        all: Tất cả Chế độ
        current: Chế độ Hiện tại
    queryInLobbyPhase:
      label: Truy vấn trong Giai đoạn Phòng chờ
      description: Ngoài giai đoạn chọn tướng và trong trận, giờ đây bạn cũng có thể xem dữ liệu của tất cả thành viên trong phòng chờ.
    premadeTeamInferMatchCountThreshold:
      label: Ngưỡng Số Trận Suy luận Nhóm Ghép
      description: Số trận tối thiểu cần thiết để xác nhận nhóm ghép trước.
    gameDetailsLoadCount:
      label: Số Lượng Chi tiết Trận Tải
      description_one: Sẽ tải thêm thông tin chi tiết của {{count}} trận đầu tiên để phân tích trận đấu.
      description_other: Sẽ tải thêm thông tin chi tiết của {{count}} trận đầu tiên để phân tích trận đấu.
    jungleAnalysisMatchHistoryLoadCount:
      label: Số Lượng Lịch sử Trận Phân tích Rừng
      description_one: Phân tích rừng có thể tiếp tục tải lịch sử trận đấu cho đến {{count}} trận đầu tiên để có đủ 20 mẫu tướng hiện tại và 50 mẫu đi rừng tổng thể.
      description_other: Phân tích rừng có thể tiếp tục tải lịch sử trận đấu cho đến {{count}} trận đầu tiên để có đủ 20 mẫu tướng hiện tại và 50 mẫu đi rừng tổng thể.
    showRecentlyUsedChampions:
      label: Hiện Tướng Đã Dùng Gần đây
      description: Hiển thị các tướng đã dùng gần đây trong thẻ người chơi.
    showChampionUsage:
      label: Hiện Lượng Sử dụng Tướng
      description: Hiển thị lượng sử dụng tướng trên thẻ người chơi.
      options:
        none: Không
        recent: Đã Dùng Gần đây
        mastery: Cấp Thành thạo
    showJunglePathing:
      label: Bật Đường đi Rừng
      description: Hiển thị phân tích đường đi rừng trong thẻ người chơi trận đang diễn ra.
    showMatchHistoryItemBorder:
      label: Hiện Viền Mục Lịch sử Trận
      description: Hiển thị viền xung quanh mục lịch sử trận đấu.
    playerCardTags:
      label: Thẻ Người chơi
      description: Những thẻ này sẽ được hiển thị trên thẻ người chơi
      tags:
        showPremadeTeamTag:
          label: Nhóm Ghép Trước
        showWinningStreakTag:
          label: Chuỗi Thắng
        showLosingStreakTag:
          label: Chuỗi Thua
        showSoloKillsTag:
          label: Trung bình Hạ gục Đơn Mỗi Trận
        showEasyGankTag:
          label: Thẻ Dễ/Khó Bị Gank
        showAverageTeamDamageTag:
          label: Sát thương Đội Trung bình
        showAverageTeamDamageTakenTag:
          label: Sát thương Nhận Đội Trung bình
        showSuspiciousFlashPositionTag:
          label: Phát hiện Bất thường Vị trí Tốt Biến
        showAverageTeamGoldTag:
          label: Vàng Đội Trung bình
        showAverageCsPerMinuteTag:
          label: CS Trung bình mỗi Phút
        showGreatPerformanceTag:
          label: Thẻ Hiệu suất Xuất sắc
        showMetTag:
          label: Người chơi Đã Gặp Trước đây
        showTaggedTag:
          label: Người chơi Đã Gắn thẻ
        showSelfTag:
          label: Thẻ Bản thân
        showWinRateTeamTag:
          label: Thẻ Tỷ lệ Thắng Cao
        showAverageDamageGoldEfficiencyTag:
          label: Thẻ Hiệu suất Vàng-Sát thương
        showPrivacyTag:
          label: Thẻ Hồ sơ Ẩn
        showAverageEnemyMissingPingsTag:
          label: Trung bình Ping Mất Tích Địch
        showAverageVisionScoreTag:
          label: Điểm Tầm nhìn Trung bình
        showAkariScoreTag:
          label: Điểm Akari
        showAverageKillDamageEfficiencyTag:
          label: Hiệu suất Sát thương Hạ gục Trung bình
  multiWindow:
    title: Đa Cửa sổ
    auxWindow:
      title: Cửa sổ Phụ
      enabled:
        label: Bật Cửa sổ Phụ
        description: Sử dụng một cửa sổ nhỏ trong một số giai đoạn trận nhất định để hiển thị trạng thái và cung cấp các hành động bổ sung.
        descriptionWithIcon: Có thể mở bằng cách nhấp vào biểu tượng nhanh ở bên phải thanh tiêu đề ({icon}) hoặc nhấp chuột phải vào biểu tượng khay và chọn "Cửa sổ Phụ").
      autoShow:
        label: Tự động Hiển thị và Đóng
        description: Tự động hiển thị hoặc đóng cửa sổ phụ trong các giai đoạn trận cụ thể.
      opacity:
        label: Độ mờ Cửa sổ
        description: Điều chỉnh mức độ trong suốt của cửa sổ phụ.
      showSkinSelector:
        label: Bộ Chọn Trang phục
        description: Hiển thị công cụ chọn trang phục nhanh trong cửa sổ phụ.
      resetWindowPosition:
        label: Đặt lại Vị trí Cửa sổ
        description: Đặt lại vị trí của cửa sổ phụ về vị trí mặc định ở giữa màn hình chính.
        button: Đặt lại
    opggWindow:
      title: Cửa sổ OP.GG
      enabled:
        label: Bật Tính năng OP.GG
        description: Sử dụng cửa sổ OP.GG để xem thông tin người chơi chi tiết và lịch sử trận đấu
        descriptionWithIcon: Có thể mở bằng cách nhấp vào biểu tượng nhanh ở bên phải thanh tiêu đề ({icon}) hoặc nhấp chuột phải vào biểu tượng khay và chọn "Cửa sổ OP.GG").
      autoShow:
        label: Tự động Hiển thị và Đóng
        description: Tự động hiển thị hoặc đóng cửa sổ OP.GG trong các giai đoạn trận cụ thể.
      opacity:
        label: Độ mờ Cửa sổ
        description: Điều chỉnh mức độ trong suốt của cửa sổ OP.GG.
      resetWindowPosition:
        label: Đặt lại Vị trí Cửa sổ
        description: Đặt lại vị trí của cửa sổ OP.GG về vị trí mặc định ở giữa màn hình chính.
        button: Đặt lại
      showShortcut:
        label: Hiện Phím tắt
        description: Sử dụng phím tắt để hiển thị hoặc ẩn cửa sổ OP.GG. Nếu trận đấu đang ở tiền cảnh, nó sẽ tự động được ghim. Đảm bảo trận đấu ở chế độ không viền hoặc cửa sổ để cửa sổ này hiển thị chính xác.
    ongoingGameWindow:
      title: Cửa sổ Lớp phủ Trận Đang Diễn Ra
      titleRequireAdmin: Cửa sổ Lớp phủ Trận Đang Diễn Ra (Yêu cầu Quyền Admin)
      enabled:
        label: Bật Cửa sổ Trận Đang Diễn Ra
        description: Hiển thị cửa sổ lớp phủ trong trận để hiển thị thông tin trận đang diễn ra. Tính năng này yêu cầu máy khách game ở chế độ cửa sổ hoặc không viền.
      showShortcut:
        label: Hiện Phím tắt
        description: Giữ phím tắt để hiển thị cửa sổ lớp phủ trong trận
    cdTimerWindow:
      title: Cửa sổ Lớp phủ Hẹn giờ
      titleRequireAdmin: Cửa sổ Lớp phủ Hẹn giờ (Yêu cầu Quyền Admin)
      description:
        lineA: Thời gian hồi phép triệu hồi của tướng địch chỉ khả dụng trong các chế độ được hỗ trợ
        leftClick1: Nhấp chuột trái
        leftClick2: Bắt đầu hoặc dừng hẹn giờ này
        rightDoubleClick1: Nhấp đúp chuột phải
        rightDoubleClick2: Gửi thời gian hồi phép tướng đã bắt đầu lên chat trong trận
        wheel1: Lăn chuột
        wheel2: Điều chỉnh thời gian của bộ hẹn giờ đã bắt đầu
