        description: Hiển thị tướng mục tiêu trước khi chọn.
      ignoreIntent:
        label: Bỏ Qua Ý Định
        description: Bỏ qua ý định của đồng đội.
      strategy:
        label: Chiến Lược Khóa
        description: Thực hiện quy trình tự động chọn theo chiến lược đã định sẵn.
        options:
          just-show: Chỉ Hiển Thị
          show-and-lock-in: Hiển Thị và Khóa
          lock-in-immediately: Khóa Ngay Lập Tức
      delaySeconds:
        label: Độ Trễ (giây)
        description: Quy trình tự động chọn sẽ được lên kế hoạch theo độ trễ đã định, bao gồm hiển thị, khóa hoặc xử lý đổi tướng. Mỗi giai đoạn sẽ không vượt quá giới hạn hệ thống.
      benchMode:
        title: Chế Độ Băng Ghế Cụ Thể (Nếu Áp Dụng)
        tooltip: Dành cho các chế độ có băng ghế, như ARAM hoặc URF.
      benchSwapAccumulatedDelaySeconds:
        label: Thời Gian Tích Lũy Tối Thiểu (giây)
        description: Chỉ khi tướng mục tiêu đã ở trên băng ghế lâu hơn giá trị này, thao tác đổi tướng mới được thực hiện.
      benchSelectFirstAvailableChampion:
        label: Chọn Tướng Khả Dụng Đầu Tiên
        description: Khi tướng mục tiêu ở trên băng ghế, chọn tướng ở đầu danh sách.
      benchHandleTradeEnabled:
        label: Xử Lý Yêu Cầu Đổi Tướng
        description: Khi nhận được yêu cầu đổi tướng, nếu đáp ứng cài đặt tướng dự kiến, hãy chấp nhận yêu cầu đổi tướng. Nếu không, từ chối yêu cầu đổi tướng.
    ban:
      title: Tự Động Cấm
