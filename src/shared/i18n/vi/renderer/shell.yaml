      # $t(common:appName) Hướng dẫn Sử dụng & Tuyên bố Miễn trừ Trách nhiệm

      > **Trước khi tải xuống, cài đặt hoặc sử dụng phần mềm này, vui lòng đọc và hiểu đầy đủ hướng dẫn cũng như tuyên bố miễn trừ trách nhiệm này.**
      > Khi bạn bắt đầu sử dụng, bạn được coi là đã hiểu đầy đủ và đồng ý với tất cả các điều khoản sau đây.

      ---

      ## I. Bản chất Phần mềm & Cách thức Mua lại
      - **$t(common:appName)** hoàn toàn là mã nguồn mở và miễn phí; tất cả các tính năng được cung cấp "nguyên trạng."
      - Phần mềm này không được bán dưới bất kỳ hình thức trả phí, đóng gói hoặc vì lợi nhuận nào. Nếu bạn gặp bất kỳ hình thức bán lại, đóng gói hoặc các hoạt động vì lợi nhuận khác, vui lòng không mua. Nếu bạn đã mua, hãy **yêu cầu hoàn tiền ngay lập tức**.

      ## II. Thông báo Rủi ro & Giới hạn Trách nhiệm
      - Sử dụng phần mềm này **có thể** dẫn đến (bao gồm nhưng không giới hạn):
        1. Tài khoản game của bạn bị đình chỉ hoặc bị cấm vĩnh viễn;
        2. Mất mát, hỏng hóc hoặc không nhất quán của dữ liệu game với dữ liệu máy chủ;
        3. Máy khách bị sập, giảm hiệu suất hoặc trải nghiệm game kém khác.
      - Đối với bất kỳ thiệt hại trực tiếp, gián tiếp, ngẫu nhiên, đặc biệt hoặc do hậu quả nào phát sinh từ việc sử dụng hoặc không thể sử dụng phần mềm này, **nhóm phát triển $t(common:appName)** và tất cả những người đóng góp không chịu bất kỳ trách nhiệm nào; mọi rủi ro liên quan đều do người dùng tự chịu.

      > Vui lòng tham khảo phần **Cải tiến Theo dõi Thông tin Trận đấu** trong [Ghi chú Bản vá 25.17](https://www.leagueoflegends.com/en-us/news/game-updates/patch-25-17-notes/).

      ## III. Tuyên bố Tương thích Máy chủ
      - **Kể từ ngày phát hành tuyên bố này, $t(common:appName) sẽ không còn cung cấp bất kỳ hình thức hỗ trợ nào cho máy chủ Trò chơi Tencent.**
      - Việc sử dụng phần mềm này trong môi trường máy chủ Tencent rất có khả năng vi phạm các thỏa thuận người dùng, quy định quản lý hoặc biện pháp bảo vệ kỹ thuật của Trò chơi Tencent; mọi hậu quả về việc khóa tài khoản, mất dữ liệu hoặc các hậu quả bất lợi khác hoàn toàn thuộc trách nhiệm của người dùng.

      ## IV. Thu thập Thông tin & Bảo vệ Quyền riêng tư
      - Để cải thiện chất lượng sản phẩm, phân tích lỗi và thực hiện thống kê bảo mật, phần mềm thu thập thông tin hệ thống **cần thiết và giới hạn** cũng như nhật ký sự cố trong quá trình hoạt động.
      - Thông tin được thu thập **không** chứa dữ liệu nhận dạng cá nhân, sẽ không được tải lên bất kỳ máy chủ bên thứ ba nào và sẽ không được sử dụng cho mục đích thương mại.

      ## V. Khác
      - Nhấp vào nút xác nhận ba lần liên tiếp có thể nhanh chóng đóng cửa sổ này. Bằng cách này, bạn được coi là đã đọc và đồng ý với hướng dẫn và tuyên bố miễn trừ trách nhiệm này.

      ---

      > **Nếu bạn có bất kỳ câu hỏi nào về hướng dẫn và tuyên bố miễn trừ trách nhiệm này hoặc cần thêm thông tin về phần mềm, vui lòng truy cập**
      > <https://github.com/LeagueAkari/LeagueAkari> .

      </div>
