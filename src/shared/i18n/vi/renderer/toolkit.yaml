toolkit:
  client:
    nativeSupport:
      unsupportedCurrentPlatform: Không được hỗ trợ trên nền tảng hiện tại
      supportedButRequiresElevation: Được hỗ trợ trên nền tảng hiện tại nhưng yêu cầu quyền quản trị viên
    leagueClient:
      title: Client Liên Minh
      disconnect:
        label: Ngắt kết nối
        description: Ngắt kết nối $t(common:appName) khỏi Client Liên Minh.
        button: Ngắt kết nối
      quitClient:
        label: Thoát Tiến trình Client
        description: Đóng Client Liên Minh.
        button: Thoát Tiến trình Client
        dialog:
          title: Thoát Tiến trình Client
          content: Bạn có chắc chắn muốn thoát tiến trình Client ? Thao tác này sẽ đóng trực tiếp game.
          positiveText: Thoát
          negativeText: Hủy
    gameClient:
      title: Client  Game
      windowsOnlyNativeAddon: Yêu cầu tiện ích bổ sung gốc (bản dựng này hiện chỉ cung cấp chúng trên Windows).
      nativeAddonRequiresAdministrator: Khả năng này được hỗ trợ trên nền tảng hiện tại, nhưng yêu cầu chạy với quyền quản trị viên.
      terminateGameClientWithShortcut:
        labelAdminRequired: Kết thúc Client  Game bằng phím tắt (Yêu cầu Quyền Admin)
        label: Bật Phím tắt Kết thúc Client  Game
        description: Khi Client  game đang chạy và ở tiền cảnh, sử dụng phím tắt có thể buộc kết thúc tiến trình Client  game. Xin lưu ý rằng hành động này buộc kết thúc tiến trình và không phải là quy trình thoát game bình thường, có thể dẫn đến các tác dụng phụ không mong muốn.
      terminateShortcut:
        label: Phím tắt Kết thúc
        labelAdminRequired: Phím tắt Kết thúc (Yêu cầu Quyền Admin)
        description: Đặt phím tắt tùy chỉnh để buộc kết thúc tiến trình Client  game.
      settingsFileMode:
        label: Khóa Cài đặt Game
        description: Ngăn các thay đổi trong game ghi đè lên cài đặt bạn đang sử dụng. Mở khóa khi bạn cần chỉnh sửa cài đặt.
        details:
          readonly: Khi bị khóa, League Akari làm cho tập tin cài đặt của Liên Minh ở chế độ chỉ đọc. Game vẫn có thể đọc cài đặt hiện tại của bạn, nhưng các thay đổi mới sẽ không được lưu đè lên chúng.
          writable: Mở khóa sẽ khôi phục quyền ghi, để đồ họa, phím tắt và các thay đổi trong game khác lưu lại bình thường.
          scope: Điều này chỉ ảnh hưởng đến tập tin cài đặt cho bản cài đặt Client  hiện đang kết nối.
        setToReadonly: Đã khóa cài đặt game
        setToWritable: Đã mở khóa cài đặt game
        failedToSet: 'Không thể chuyển đổi khóa cài đặt: {{reason}}'
      nativeAddonInitializationFailed: Khởi tạo mô-đun client gốc thất bại
    leagueClientUx:
      title: Giao diện Client Liên Minh
      fixWindowMethodAOptions:
        label: Điều chỉnh Kích thước Cửa sổ
        labelAdminRequired: Điều chỉnh Kích thước Cửa sổ (Yêu cầu Quyền Admin)
        description: <a target="_blank" href="https://github.com/LeagueTavern/fix-lcu-window">FixLCUWindow</a> - Điều chỉnh kích thước cửa sổ bằng WinAPI. Có thể thử khi kích thước giao diện Client  không chính xác.
        unsupportedCurrentPlatform: Điều chỉnh kích thước cửa sổ không được hỗ trợ trên nền tảng hiện tại.
        requiresAdministrator: Điều chỉnh kích thước cửa sổ được hỗ trợ trên nền tảng hiện tại, nhưng yêu cầu chạy với quyền quản trị viên.
        button: Điều chỉnh
        dialog:
          title: Điều chỉnh Kích thước Cửa sổ
          content: Bạn có muốn điều chỉnh kích thước cửa sổ? Hãy thử thao tác này nếu Client  không hiển thị đúng cách.
          positiveText: Điều chỉnh
          negativeText: Hủy
      restartUx:
        label: Khởi động lại Giao diện Client
        description: Khởi động lại ngay tiến trình kết xuất. Thao tác này không ảnh hưởng đến các hoạt động đang diễn ra và có thể được sử dụng để sửa lỗi giao diện Client .
        button: Khởi động lại Tiến trình UX
        dialog:
          title: Khởi động lại Tiến trình UX
          content: Bạn có muốn khởi động lại tiến trình UX? Hãy thử thao tác này nếu Client  không hiển thị đúng cách.
          positiveText: Khởi động lại
          negativeText: Hủy
      killUx:
        label: Kết thúc Tiến trình UX
        description: Kết thúc ngay lập tức tiến trình kết xuất. Thao tác này không ảnh hưởng đến các hoạt động đang diễn ra.
        button: Kết thúc Tiến trình UX
        dialog:
          title: Kết thúc Tiến trình UX
          content: Bạn có chắc chắn muốn kết thúc tiến trình UX? Bạn có thể cần khởi động lại tiến trình này. Kết thúc tiến trình UX sẽ không làm game thoát nhưng có thể giảm đáng kể việc sử dụng tài nguyên.
          positiveText: Kết thúc
          negativeText: Hủy
      launchUx:
        label: Khởi chạy Tiến trình UX
        description: Khởi chạy ngay tiến trình kết xuất nếu nó đã bị đóng.
        button: Khởi chạy Tiến trình UX
        dialog:
          title: Khởi chạy Tiến trình UX
          content: Bạn có muốn khởi chạy tiến trình UX?
          positiveText: Khởi chạy
          negativeText: Hủy
